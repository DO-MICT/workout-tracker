<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5-day split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400..900&display=swap" rel="stylesheet">
<script>try{var _t=localStorage.getItem("split5-theme");if(_t==="dark"||_t==="light")document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="planwrap"><h1><button id="planBtn" class="planbtn" aria-haspopup="true" aria-expanded="false" aria-controls="planMenu">5-day split<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></h1>
      <div class="menu planmenu" id="planMenu" hidden></div></div>
      <div class="status" id="status">Saved on this phone</div>
    </div>
  </header>
  <nav class="daynav" id="tabs" aria-label="Day"></nav>
  <main id="day"></main>
</div>
<div class="timer" id="timer" role="status" aria-live="polite">
  <span>Rest</span><span class="t" id="tt">1:30</span><span class="tb"><i id="tbar"></i></span>
  <button id="t30">+30s</button><button id="tskip">Done</button>
</div>
<div class="toast" id="toast"></div>
<div class="sheet" id="profile" role="dialog" aria-modal="true" aria-labelledby="ptitle" tabindex="-1" hidden></div>
<div class="sheet" id="builder" role="dialog" aria-modal="true" aria-labelledby="btitle" tabindex="-1" hidden></div>
<div class="donepop" id="donepop" hidden></div>
<div class="sheet note-sheet" id="notesheet" role="dialog" aria-modal="true" aria-labelledby="ntitle" tabindex="-1" hidden></div>
<div class="sheet" id="plans" role="dialog" aria-modal="true" aria-labelledby="pltitle" tabindex="-1" hidden></div>
<div class="sheet" id="wizard" role="dialog" aria-modal="true" aria-labelledby="wtitle" tabindex="-1" hidden></div>
<div class="sheet" id="equip" role="dialog" aria-modal="true" aria-labelledby="etitle" tabindex="-1" hidden></div>
<div class="sheet" id="feedback" role="dialog" aria-modal="true" aria-labelledby="fbtitle" tabindex="-1" hidden></div>
<div class="sheet" id="history" role="dialog" aria-modal="true" aria-labelledby="htitle" tabindex="-1" hidden></div>
<div class="sheet" id="sugg" role="dialog" aria-modal="true" aria-labelledby="sgtitle" tabindex="-1" hidden></div>
<div class="sheet" id="exlib" role="dialog" aria-modal="true" aria-labelledby="eltitle" tabindex="-1" hidden></div>
<div class="sheet" id="more" role="dialog" aria-modal="true" aria-labelledby="mtitle" tabindex="-1" hidden></div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div class="sheet onboard" id="onboard" role="dialog" aria-modal="true" aria-label="Get started" tabindex="-1" hidden></div>

<script src="src/js/diagrams.js"></script>
<script src="src/js/gfd-exercise-art.js"></script>
<script src="src/js/exart.js"></script>
<script src="src/js/library.js"></script>
<script src="src/js/state.js"></script>
<script src="src/js/day.js"></script>
<script src="src/js/plans.js"></script>
<script src="src/js/onboarding.js"></script>
<script src="src/js/signin.js"></script>
<script src="src/js/history.js"></script>
<script src="src/js/feedback.js"></script>
<script src="src/js/backup.js"></script>
<script src="src/js/coles.js"></script>
<script src="src/js/builder.js"></script>
<script src="src/js/equipment.js"></script>
<script src="src/js/catalog.js"></script>
<script src="src/js/profile.js"></script>
<script src="src/js/finish.js"></script>
<script src="src/js/stats.js"></script>
<script src="src/js/tabs.js"></script>
<script src="src/js/main.js"></script>
</body>
</html>

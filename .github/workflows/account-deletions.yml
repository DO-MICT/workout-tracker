name: Account deletions
# WP8: once a day, asks the delete-account Edge Function to delete the accounts whose 7 days of grace are over.
# The function does the work (files, RevenueCat, auth user); this only calls it. See docs/db-brief.md.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   DELETE_FN_URL       https://<project ref>.supabase.co/functions/v1/delete-account (production)
#   DELETE_CRON_SECRET  the same long random text as the function's DELETE_CRON_SECRET secret in Supabase
# Until both are set, the run only prints a warning.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: account-deletions
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DELETE_FN_URL: ${{ secrets.DELETE_FN_URL }}
      DELETE_CRON_SECRET: ${{ secrets.DELETE_CRON_SECRET }}
    steps:
      - name: Delete accounts that are due
        run: |
          if [ -z "$DELETE_FN_URL" ] || [ -z "$DELETE_CRON_SECRET" ]; then
            echo "::warning::Account deletions aren't set up yet (DELETE_FN_URL and DELETE_CRON_SECRET secrets). See docs/db-brief.md."
            exit 0
          fi
          code=$(curl -sS -o out.json -w '%{http_code}' -X POST "$DELETE_FN_URL" \
            -H "x-cron-secret: $DELETE_CRON_SECRET" -H 'Content-Type: application/json' --data '{}')
          cat out.json; echo
          { echo "### Account deletions"; echo '```'; cat out.json; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "200" ]; then echo "::error::delete-account returned $code. Failed requests keep their reason in public.deletion_requests.last_error."; exit 1; fi

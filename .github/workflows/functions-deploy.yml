name: Deploy functions
# WP8: deploys the Supabase Edge Functions in supabase/functions (delete-account, billing-webhook) to GFD Dev or GFD Prod.
# Run by hand: Actions > Deploy functions > Run workflow. The production job waits for Deon's approval.
#
# Secrets: repository secret SUPABASE_ACCESS_TOKEN (supabase.com > Account > Access tokens);
#          environment variable PROJECT_REF in the dev and production environments
#          (Settings > Environments > <env> > Variables), the project ref of GFD Dev or GFD Prod (the part before .supabase.co).
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [dev, production]
        default: dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Deploy functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Set the SUPABASE_ACCESS_TOKEN secret and the PROJECT_REF variable for ${{ inputs.target }}. See docs/db-brief.md."; exit 1
          fi
          for fn in delete-account billing-webhook; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api
            echo "Deployed $fn to ${{ inputs.target }} ($PROJECT_REF)" >> "$GITHUB_STEP_SUMMARY"
          done

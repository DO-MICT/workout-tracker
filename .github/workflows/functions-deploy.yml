name: Deploy functions
# WP8: deploys the Supabase Edge Functions in supabase/functions (now: delete-account) to staging or production.
# Run by hand: Actions > Deploy functions > Run workflow. The production job waits for Deon's approval.
#
# Secrets: repository secret SUPABASE_ACCESS_TOKEN (supabase.com > Account > Access tokens);
#          environment variable PROJECT_REF in the staging and production environments
#          (Settings > Environments > <env> > Variables), e.g. zdllpjrkwcdmcuizxuum for production.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Deploy delete-account
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Set the SUPABASE_ACCESS_TOKEN secret and the PROJECT_REF variable for ${{ inputs.target }}. See docs/db-brief.md."; exit 1
          fi
          supabase functions deploy delete-account --project-ref "$PROJECT_REF" --use-api
          echo "Deployed delete-account to ${{ inputs.target }} ($PROJECT_REF)" >> "$GITHUB_STEP_SUMMARY"

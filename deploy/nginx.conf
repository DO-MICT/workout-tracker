server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Android App Links must stay reachable despite the dot-file rule below
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # Never serve hidden files
    location ~ /\. {
        deny all;
    }

    # Service worker: always check for a new version
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Manifest with the right type, so "Add to home screen" works
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Scripts and styles: pick up a deploy on the next visit
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

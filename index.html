<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16202B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workouts">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{var _t=localStorage.getItem("split5-theme");if(_t==="dark"||_t==="light")document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<style>
:root{
  --bg:#EEF0F2;--card:#FFFFFF;--ink:#16202B;--muted:#5B6672;--line:#D3D8DE;
  --accent:#F2C230;--accent-ink:#1A1500;--blue:#2446A8;--steel:#A9B2BC;--done:#1F7A4D;--done-bg:#E3F3EA;--on-done:#FFFFFF;--warn:#A85A12;--shadow:rgba(0,0,0,.2);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161B;--card:#1B2027;--ink:#E9ECEF;--muted:#9AA4AE;--line:#2C333C;
    --accent:#F2C230;--accent-ink:#1A1500;--blue:#8AA6FF;--steel:#56606B;--done:#45C08A;--done-bg:#173226;--on-done:#06240F;--warn:#F0A867;--shadow:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161B;--card:#1B2027;--ink:#E9ECEF;--muted:#9AA4AE;--line:#2C333C;
  --accent:#F2C230;--accent-ink:#1A1500;--blue:#8AA6FF;--steel:#56606B;--done:#45C08A;--done-bg:#173226;--on-done:#06240F;--warn:#F0A867;--shadow:rgba(0,0,0,.55);
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 120px}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:1.9rem;line-height:1;margin:0;font-weight:800;letter-spacing:.01em}
.status{font-size:.85rem;color:var(--muted);margin-top:4px}
.who{display:flex;gap:6px;align-items:center;position:relative}
.menu-btn{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:12px;width:46px;height:46px;display:grid;place-items:center;cursor:pointer;padding:0}
.menu-btn[aria-expanded="true"]{background:var(--ink);color:var(--bg)}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:7;min-width:230px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 28px var(--shadow)}
.menu[hidden]{display:none}
.wzsteps{margin:2px 0 12px}
.wzsteps ol{display:flex;gap:6px;list-style:none;margin:0 0 6px;padding:0}
.wzsteps li{flex:1;height:6px;border-radius:3px;background:var(--line)}
.wzsteps li span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wzsteps li.done{background:var(--done)}
.wzsteps li.on{background:var(--ink)}
.wzsteps p{margin:0;font-size:.9rem;color:var(--muted)}
.wzsteps p b{color:var(--ink)}
.wzdays{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.wzday{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 6px;cursor:pointer;text-align:center;min-height:64px}
.wzday b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.4rem;line-height:1}
.wzday span{font-size:.75rem;color:var(--muted)}
.wzday[aria-pressed="true"]{background:var(--accent);border-color:var(--ink);color:var(--accent-ink)}
.wzday[aria-pressed="true"] span{color:var(--accent-ink)}
.wzday:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wzcount{color:var(--muted);font-size:.9rem;margin:10px 0 0}
.wznav{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:18px;position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.wznav .primary,.wznav .ghost{width:100%;margin:0}
.wzdaytabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.wzdaytabs .chip[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.wzerr{color:#C0392B;font-weight:600;min-height:1.2em;margin:0}
.wzrev{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.wzrev-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wzrev-h h3{margin:0;font-size:1.5rem}
.wzrev-h h4{margin:0;font-size:1.1rem;display:flex;gap:8px;align-items:baseline}
.wzrev-h h4 span{font-family:"Barlow Condensed",sans-serif;color:var(--muted)}
.wzrev .linkbtn{padding:4px 0;min-height:32px}
.wzmeta{margin:2px 0 0;color:var(--muted);font-size:.9rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wzlist{margin:6px 0 2px;padding-left:20px;font-size:.92rem}
.wzlist li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.wzlist li.lk{border-left:3px solid var(--blue);padding-left:6px;margin-left:-9px}
.wzlist em{font-style:normal;color:var(--warn);font-size:.8rem}
.wzlist b{font-family:"Barlow Condensed",sans-serif;white-space:nowrap}
.wzdone{background:var(--card);border-radius:14px;padding:16px}
.wzdone h3{margin:0 0 4px;font-size:1.7rem}
.wzdone p{margin:0 0 8px;color:var(--muted)}
#newPlan{width:100%;margin-top:6px}
.planwrap{position:relative}
.planbtn{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:inherit;font:inherit;padding:0;cursor:pointer;text-align:left;border-radius:8px}
.planbtn svg{flex:none;margin-top:4px;color:var(--muted)}
.planbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.planbtn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.planmenu{left:0;right:auto;min-width:250px}
.menu-lbl2{font-size:.82rem;font-weight:600;color:var(--muted);padding:2px 2px 6px}
.pm-item{display:flex!important;justify-content:space-between;align-items:center;gap:10px}
.pm-item b{color:var(--done)}
.pm-item[aria-pressed="true"]{color:var(--ink)}
.pm-manage{color:var(--blue)}
.plcard{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:12px;border:2px solid transparent}
.plcard.on{border-color:var(--done)}
.plhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plhead h3{margin:0;font-size:1.45rem;font-weight:700}
.pltag{background:var(--done);color:var(--on-done);border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:700}
.pldesc{margin:4px 0 6px;color:var(--muted);font-size:.9rem}
.pldesc em{font-style:normal;color:var(--warn);font-weight:600}
.pldays{list-style:none;margin:6px 0 10px;padding:0;display:grid;gap:3px}
.pldays li{display:grid;grid-template-columns:42px 1fr auto;gap:6px;font-size:.92rem;align-items:baseline}
.pldays b{font-family:"Barlow Condensed",sans-serif;font-size:1rem}
.pldays span{color:var(--muted);font-size:.8rem}
.placts{display:flex;flex-wrap:wrap;gap:6px}
.chip.primarychip{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.danger{border-color:#C0392B;color:#C0392B}
.plren{display:flex;gap:8px;align-items:center}
.plren input{flex:1;min-width:0;box-sizing:border-box;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.3rem}
.emptyday{background:var(--card);border-radius:12px;padding:16px;text-align:center;color:var(--muted)}
.emptyday p{margin:0 0 10px}
.emptyday .primary{width:100%}
.menu-theme{border-top:1px solid var(--line);padding:10px 2px 2px}
.menu-theme>span{display:block;font-weight:600;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;min-height:36px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.seg button:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.menu-item:first-child{border-top:0;padding-top:4px}
.menu-item{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 2px 4px;cursor:pointer;font-weight:600;min-height:44px}
.chip{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.icon-btn{border:0;background:transparent;padding:8px;cursor:pointer;color:var(--muted);min-height:40px;min-width:40px;border-radius:8px}
.rename{display:none;gap:8px;align-items:center;margin:-4px 0 14px;flex-wrap:wrap}
.rename.open{display:flex}
.rename input{flex:1 1 120px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.daynav{position:relative;margin-bottom:18px}
.daybtn{width:100%;display:flex;align-items:center;gap:10px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:8px 14px 9px;min-height:56px;cursor:pointer;text-align:left;border-bottom:5px solid var(--ink)}
.daybtn .dn{flex:1;min-width:0}
.daybtn b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.7rem;line-height:1.05;font-weight:800}
.daybtn small{display:block;font-size:.8rem;line-height:1.2;opacity:.85}
.daybtn svg{flex:none}
.daybtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.daybtn:disabled{cursor:default}
.daybtn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.daymenu{left:0;right:0;min-width:0;max-height:min(70vh,520px);overflow:auto}
.dm-item{display:flex!important;align-items:center;gap:10px}
.dm-item .dn{flex:1;min-width:0}
.dm-item .dn>span{display:block}
.dm-item .dn small{display:block;font-weight:500;color:var(--muted);font-size:.82rem}
.dm-item b{color:var(--done)}
.dm-today{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--line);color:var(--ink);border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.daybtn .dm-today{background:var(--accent-ink);color:var(--accent)}
.dayhead h2{font-size:2.6rem;line-height:.95;margin:0;font-weight:800}
.dayhead p{margin:6px 0 0;color:var(--muted)}
.progress{margin:14px 0 18px;display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
.bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.warm{background:var(--card);border-left:5px solid var(--steel);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.95rem}
.ex{background:var(--card);border-radius:12px;padding:14px 14px 12px;margin-bottom:12px}
.ex.ss-a{border-top:4px solid var(--blue);border-radius:12px 12px 12px 12px;margin-bottom:4px}
.ex.ss-b{margin-top:0}
.ex-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
details.ex>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:48px;border-radius:8px}
details.ex>summary::-webkit-details-marker{display:none}
details.ex>summary .ttl{flex:1;min-width:0}
details.ex>summary .meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
details.ex>summary .cnt{font-size:.78rem;color:var(--muted);font-weight:600}
details.ex>summary .cnt.all{color:var(--done)}
details.ex>summary::after{content:"";width:10px;height:10px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 2px;transition:transform .2s;flex:none}
details.ex[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
details.ex[open]>summary{margin-bottom:2px}
details.ex.alldone{border-left:5px solid var(--done)}
@media (prefers-reduced-motion:reduce){details.ex>summary::after{transition:none}}
.ex h3{margin:0;font-size:1.45rem;line-height:1.05;font-weight:700}
.target{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.25rem;white-space:nowrap;background:var(--bg);padding:2px 8px;border-radius:6px}
.tag{display:inline-block;font-size:.8rem;color:var(--blue);font-weight:600;margin-top:4px}
.last{font-size:.88rem;color:var(--muted);margin:6px 0 8px}
details.how{margin:4px 0 10px}
details.how summary{cursor:pointer;font-weight:600;color:var(--blue);padding:6px 0;list-style:none;min-height:36px;display:flex;align-items:center;gap:6px}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"+";display:inline-grid;place-items:center;width:20px;height:20px;border:1.5px solid currentColor;border-radius:50%;font-size:.9rem;line-height:1}
details.how[open] summary::before{content:"−"}
.fig{background:var(--bg);border-radius:10px;padding:8px 6px 4px;margin:4px 0 8px}
.fig svg{display:block;width:100%;max-width:100%;height:auto}
.fig .cap{display:grid;grid-template-columns:1fr auto 1fr;column-gap:8px;font-size:.78rem;color:var(--muted);text-align:center;padding:2px 0 2px;font-weight:600}
.fig .cap span:nth-child(2){opacity:.5}
.cues{margin:0;padding-left:20px;font-size:.95rem}
.cues li{margin-bottom:4px}
.sets{display:grid;gap:6px}
.setrow{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 52px;gap:6px;align-items:center}
.setrow .n{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--muted);text-align:center;font-size:1.1rem}
.setrow input{box-sizing:border-box;width:100%;min-width:0;padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:center;font-size:1rem}
.setrow input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.lbl{font-size:.72rem;color:var(--muted);text-align:center}
.tick{border:2px solid var(--line);background:transparent;border-radius:8px;height:42px;cursor:pointer;font-weight:700;font-size:1.1rem}
.tick[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--on-done)}
.setrow.isdone input{background:var(--done-bg);border-color:transparent}
.fin{border:2px dashed var(--steel);background:transparent}
.fin .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.actions{display:grid;gap:10px;margin:22px 0}
.linkbtn.hlink{font-size:.88rem;padding:0;min-height:32px;margin:-4px 0 6px}
.hpend{background:var(--done-bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.92rem}
.hempty{background:var(--card);border-radius:14px;padding:16px;margin-top:12px}
.hempty b{font-size:1.05rem}.hempty p{margin:6px 0 0;color:var(--muted)}
.hmonth{font-size:1.1rem;color:var(--muted);margin:20px 0 8px}
.hcard{background:var(--card);border-radius:14px;margin-bottom:8px;padding:0 14px}
.hcard>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;min-height:44px}
.hcard>summary::-webkit-details-marker{display:none}
.hcard>summary svg{flex:none;color:var(--muted)}
.hcard[open]>summary svg{transform:rotate(180deg)}
.hcard>summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.hdate{flex:none;width:44px;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.hdate b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;line-height:1;font-weight:800}
.hdate span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.hmain{flex:1;min-width:0}
.hmain b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.3rem;line-height:1.1}
.hmain span{display:block;font-size:.84rem;color:var(--muted);line-height:1.3}
.htag{display:inline-block;font-style:normal;font-size:.72rem;font-weight:700;background:var(--done-bg);color:var(--done);border-radius:999px;padding:2px 8px;margin-top:4px}
.htag.imp{background:var(--line);color:var(--muted)}
.hex{list-style:none;margin:0 0 6px;padding:0;border-top:1px solid var(--line)}
.hex li{padding:8px 0;border-bottom:1px solid var(--line)}
.hex li.g{border-left:4px solid var(--blue);padding-left:10px}
.hex li span{display:block;font-size:.9rem;color:var(--muted);margin-top:2px}
.hexname{font-weight:700;padding:0;min-height:32px;text-align:left;font-size:1rem}
.hsmall{font-size:.82rem;color:var(--muted);margin:4px 0}
.linkbtn.hdelbtn{color:#C0392B;font-size:.9rem;padding:6px 0 12px}
.hdel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0 14px}
.hdel span{flex:1 1 100%;font-size:.92rem}
.hdel button{flex:1;padding:11px;font-size:1.05rem}
.primary.danger{background:#C0392B;color:#fff}
.hmore{width:100%;margin-top:6px}
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:6px 0 12px}
.hstats div{background:var(--card);border-radius:12px;padding:10px 12px}
.hstats span{display:block;font-size:.78rem;color:var(--muted)}
.hstats b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.5rem;line-height:1.1;white-space:nowrap}
.hstats em{font-style:normal;font-size:.76rem;color:var(--muted)}
.hchart{background:var(--card);border-radius:14px;padding:10px 10px 4px;margin:0 0 6px}
.hchart figcaption{font-size:.85rem;font-weight:600;margin:0 4px 4px}
.hchart svg{display:block;width:100%;height:auto}
.hgrid{stroke:var(--line);stroke-width:1}
.hax{fill:var(--muted);font-size:10px}
.hline{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.hdot{fill:var(--blue);stroke:var(--card);stroke-width:1.5}
.hsess{list-style:none;margin:6px 0 0;padding:0}
.hsess li{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.hsess li div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hsess li .htag{margin-top:0}
.hsess li span{display:block;font-size:.9rem;color:var(--muted);margin-top:2px}
.primary{border:0;background:var(--ink);color:var(--bg);padding:15px;border-radius:12px;font-weight:700;font-size:1.05rem;cursor:pointer;font-family:"Barlow Condensed",sans-serif;font-size:1.35rem}
.ghost{border:1px solid var(--line);background:transparent;padding:12px;border-radius:12px;cursor:pointer;color:var(--muted)}
.notes details{background:var(--card);border-radius:12px;padding:4px 14px;margin-bottom:10px}
.notes summary{cursor:pointer;font-weight:700;padding:10px 0;font-family:"Barlow Condensed",sans-serif;font-size:1.25rem}
.notes p{margin:0 0 12px}
.timer{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);display:none;align-items:center;gap:12px;z-index:5}
.timer.on{display:flex}
.timer .t{font-family:"Barlow Condensed",sans-serif;font-size:1.8rem;font-weight:800;min-width:64px}
.timer .tb{flex:1;height:8px;background:rgba(127,127,127,.35);border-radius:6px;overflow:hidden}
.timer .tb i{display:block;height:100%;background:var(--accent);width:100%}
.timer button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:8px 12px;cursor:pointer}

.wheel{position:relative;display:flex;justify-content:center;gap:18px;background:var(--card);border-radius:14px;padding:8px 12px;max-width:320px}
.wheel::before{content:"";position:absolute;left:10px;right:10px;top:50%;height:40px;transform:translateY(-50%);background:var(--bg);border-radius:10px;pointer-events:none}
.wcol{position:relative;display:flex;align-items:center;gap:6px}
.wscroll{position:relative;height:200px;width:72px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;

.wscroll::-webkit-scrollbar{display:none}
.wscroll:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wpad{height:80px}
.witem{height:40px;line-height:40px;text-align:center;scroll-snap-align:center;font-family:"Barlow Condensed",sans-serif;font-size:1.5rem;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
.witem.on{color:var(--ink);font-weight:800;font-size:1.75rem}
.wunit{position:relative;font-weight:600;color:var(--muted);font-size:.9rem;width:28px}
.linkbtn{border:0;background:transparent;color:var(--blue);font-weight:600;padding:10px 0;cursor:pointer;min-height:44px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--done);color:var(--on-done);padding:10px 16px;border-radius:10px;font-weight:600;display:none;z-index:9}
.toast.on{display:block}
/* figure styles */
.bd polyline,.bd line{stroke:var(--ink);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hd{fill:var(--ink)}
.eq{fill:var(--steel)}
.st{stroke:var(--steel);stroke-width:2.6;stroke-linecap:round}
.wt{fill:var(--accent);stroke:var(--ink);stroke-width:1.2}
.cb{stroke:var(--blue);stroke-width:1.6;stroke-dasharray:3 2}
.pl{fill:var(--blue)}
.fl{stroke:var(--line);stroke-width:2}
.ar{stroke:var(--muted);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

    LIB[ex.id]={id:ex.id,n:ex.n,f:ex.f,c:ex.c,mg:m[0],req:m[1],sets:ex.sets,reps:ex.reps,lab:"w"};

function gearName(id){for(var i=0;i<EQUIP.length;i++)for(var j=0;j<EQUIP[i].items.length;j++)if(EQUIP[i].items[j][0]===id)return EQUIP[i].items[j][1];return id;}
/* returns [] when you can do it, otherwise a list of missing "any of" groups */
function missingFor(ex,g){
  g=g||gear(); if(!ex.req) return [];
  return ex.req.split(",").filter(function(alt){return !alt.split("|").some(function(id){return g.indexOf(id)>=0;});});
}
function needsText(ex,g){return missingFor(ex,g).map(function(alt){return alt.split("|").map(gearName).join(" or ");}).join(" and ");}
function labOf(ex){return LABS[ex.lab||"w"]||LABS.w;}

/* Keep logs in the artifact's own database (private to each signed-in viewer),
   with localStorage as a fast local copy. */
(function initCloud(){
  if(!window.claude||!claude.use) return;
  Promise.all([claude.use("db"),claude.use("user")]).then(function(r){
    var db=r[0],user=r[1]; if(!db||!user) return null;
    return user.id().then(function(id){
      if(!id) return null;
      var ref=db.doc("data/users/"+id+"/profile");
      return ref.get().then(function(snap){
        var remote=snap.exists?snap.data():null;
        var ok=remote&&remote.v===1&&remote.cur&&remote.last;
        if(ok&&(remote.ts||0)>(S.ts||0)){
          S=JSON.parse(JSON.stringify(remote));S.who=0;
          try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
          cloudRef=ref;cloudOk=true;
          renderAll();
        }else{
          cloudRef=ref;
          if(!S.ts) S.ts=Date.now();
          cloudDirty=true;cloudPush();
        }
      });
    });
  }).then(function(){seedMyGym();histInit();}).catch(function(){cloudRef=null;cloudOk=false;setStatus();seedMyGym();histInit();});
})();

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function prs(){ if(!S.pr) S.pr=[{},{}]; return S.pr[S.who]||(S.pr[S.who]={}); }
function prFor(ex){
  var best=parseFloat(prs()[ex.id])||0, L=last()[ex.id];
  if(L&&L.sets) L.sets.forEach(function(s){var v=parseFloat(s.w); if(v>best) best=v;});

function setsFor(ex){
  var c=cur(); if(!c[ex.id]){c[ex.id]=[];}
  var arr=c[ex.id]; while(arr.length<ex.sets)arr.push({w:"",r:"",d:false});
  /* migrate: clear weights an older version auto-filled; they now show as a grey PR hint instead */
  arr.forEach(function(s){ if(s.pf&&!s.d&&!s.t) s.w=""; delete s.pf; });
  return arr;
}

  var lb=labOf(ex), u2=lb[1]==="reps"?"":" "+lb[1];

  return "Last time"+ds+": "+parts.join(", ");

function groupsOf(d){
  var out=[], i=0;
  while(i<d.ex.length){
    var ex=d.ex[i];
    if(ex.ss==="c"){var gc=[ex]; while(d.ex[i+1]&&d.ex[i+1].ss==="c"){gc.push(d.ex[++i]);} out.push({kind:"circuit",items:gc});}
    else if(ex.ss==="a"){var gs=[ex]; while(d.ex[i+1]&&d.ex[i+1].ss==="b"){gs.push(d.ex[++i]);} out.push({kind:"superset",items:gs});}
    else out.push({kind:"single",items:[ex]});
    i++;
  }
  return out;
}

function phFor(ex,i){
  var arr=setsFor(ex), lb=labOf(ex), L=last()[ex.id], wp="", rp="";
  for(var j=i-1;j>=0;j--){ if(!wp&&arr[j].w) wp=arr[j].w; if(!rp&&arr[j].r) rp=arr[j].r; }
  if(!wp) wp=prFor(ex)||lb[0];

  return [wp,rp];
}

    var el=document.querySelector('details.ex[data-ex="'+ex.id+'"]'); if(!el) return;
    var a=setsFor(ex), n=0; for(var i=0;i<ex.sets;i++) if(a[i].d) n++;

    var mgs=items.map(function(x){return x.mg;}).filter(function(v,k,a){return a.indexOf(v)===k;});
    var base=(circuit?"Circuit":"Superset")+": "+mgs.join(" & ");

function histChart(pts,m){
  var W=320,Hh=150,pl=38,pr=12,pt=14,pb=24, vs=pts.map(function(p){return p.best;});
  var lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs); if(hi===lo){hi+=1;lo=Math.max(0,lo-1);}

  return '<figure class="hchart"><figcaption>'+esc(m[0])+' per workout ('+esc(m[1])+')</figcaption><svg viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="'+esc(label)+'">'+
    ticks.map(function(v){return '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'" class="hgrid"/><text x="'+(pl-6)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end" class="hax">'+fmtNum(v)+'</text>';}).join("")+
    '<path d="'+line+'" class="hline"/>'+pts.map(function(p,i){return '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.best).toFixed(1)+'" r="'+(i===pts.length-1?4.5:3)+'" class="hdot"><title>'+esc(hDate(p.at,{day:"numeric",month:"short"})+": "+fmtNum(p.best)+" "+m[1])+'</title></circle>';}).join("")+
    '<text x="'+pl+'" y="'+(Hh-6)+'" class="hax">'+esc(hDate(pts[0].at,{day:"numeric",month:"short"}))+'</text><text x="'+(W-pr)+'" y="'+(Hh-6)+'" text-anchor="end" class="hax">'+esc(hDate(pts[pts.length-1].at,{day:"numeric",month:"short"}))+'</text></svg></figure>';
}

    var st=end+b[0]; if(st<a.currentTime) return;
    var o=a.createOscillator(), f=a.createBiquadFilter(), g=a.createGain();
    o.type="square"; o.frequency.value=b[1]; f.type="lowpass"; f.frequency.value=3200;
    g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.28,st+0.01);
    g.gain.setValueAtTime(0.28,st+b[2]-0.04); g.gain.exponentialRampToValueAtTime(0.0001,st+b[2]);
    o.connect(f); f.connect(g); g.connect(a.destination); o.start(st); o.stop(st+b[2]+0.02); pingNodes.push(o);
  });
}
function startTimer(sec){
  tTotal=sec;tEnd=Date.now()+sec*1000; schedulePing(sec);
  document.getElementById("timer").classList.add("on");
  clearInterval(tInt);tick();tInt=setInterval(tick,250);
}
function tick(){
  var left=Math.max(0,Math.round((tEnd-Date.now())/1000));
  document.getElementById("tt").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
  document.getElementById("tbar").style.width=(left/tTotal*100)+"%";
  if(left<=0){clearInterval(tInt);document.getElementById("tt").textContent="Go";try{navigator.vibrate&&navigator.vibrate(200);}catch(e){}setTimeout(stopTimer,2500);}
}
function stopTimer(){if(Date.now()<tEnd-300) cancelPing();clearInterval(tInt);document.getElementById("timer").classList.remove("on");}

renderAll();
if(!window.claude||!claude.use){ seedMyGym(); if(!WEB_MODE) histInit(); }
if(WEB_MODE) webStart(); else startOnboarding();
</script>

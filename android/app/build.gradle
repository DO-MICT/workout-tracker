apply plugin: 'com.android.application'

android {
    namespace = "co.za.getfitdaily.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "co.za.getfitdaily.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // set by the android-build workflow: -PgfdVersionCode=<run number> -PgfdVersionName=<APP_VERSION>
        versionCode((project.findProperty("gfdVersionCode") ?: "1") as Integer)
        versionName(project.findProperty("gfdVersionName") ?: "dev")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Upload key for Google Play (Play App Signing keeps the real key). Comes from the workflow's secrets;
    // without them a release build is left unsigned and only the debug APK is usable.
    signingConfigs {
        release {
            def ks = System.getenv("GFD_UPLOAD_KEYSTORE")
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv("GFD_UPLOAD_KEYSTORE_PASSWORD")
                keyAlias System.getenv("GFD_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("GFD_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    // Two apps from one codebase (docs/android-brief.md, "Dev test app"):
    //   prod = the Play app, co.za.getfitdaily.app, talks to GFD Prod
    //   dev  = "GFD Dev", co.za.getfitdaily.app.dev, talks to GFD Dev; installs next to the Play app, never goes to Play.
    // The web files decide the server: python3 tools/build_app.py [--env dev]. The check below stops a mix-up.
    flavorDimensions = ["env"]
    productFlavors {
        prod {
            dimension "env"
        }
        dev {
            dimension "env"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // no upload key (a local build, or before Deon makes one): sign with the debug key so the APK still installs
            signingConfig signingConfigs.release.storeFile ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// The web files inside the APK must be built for the same environment as the flavour.
android.applicationVariants.all { variant ->
    def want = variant.flavorName == "dev" ? "dev" : "production"
    variant.preBuildProvider.configure {
        doFirst {
            def page = file("src/main/assets/public/index.html")
            if (page.exists() && !page.text.contains("\"env\": \"${want}\"")) {
                throw new GradleException("The web files are not built for ${want}. Run: python3 tools/build_app.py --env ${want} && npx cap sync android")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
